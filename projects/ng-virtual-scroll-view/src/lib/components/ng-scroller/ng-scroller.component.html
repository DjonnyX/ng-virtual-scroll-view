<div localeSensitive [langTextDir]="($langTextDir | async)!" [listDir]="($direction | async)!" class="ngvs__container"
    [ngClass]="($containerClasses | async)!">
    <svg part="viewport" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink">
        <filter [id]="_filterId">
            <feGaussianBlur #filter></feGaussianBlur>
        </filter>
        <foreignObject xmlns="http://www.w3.org/1999/xhtml" width="100%" height="100%" class="ngvs__viewport">
            <div class="ngvs__scroller-wrapper" [class.filtered]="($motionBlurEnabled | async)!"
                [style.filter]="(($motionBlurEnabled | async)! ? _filter : 'unset')">
                <div cdkScrollable #scrollViewport part="scroller" class="ngvs__scroller">
                    <div #scrollContent [attr.aria-orientation]="($direction | async)!"
                        [attr.aria-activedescendant]="($focusedElement | async)!" tabindex="0" part="content"
                        class="ngvs__content" [ngClass]="($actualClasses | async)!" [ngStyle]="($listStyles | async)!">
                        <ng-content></ng-content>
                    </div>
                </div>
            </div>
        </foreignObject>
    </svg>
    <ng-container *ngIf="($scrollbarEnabled | async)!">
        <ng-scroll-bar *ngIf="($scrollbarVerticalEnabled | async)!" #scrollBarVertical direction="vertical"
            [size]="($thumbSizeVertical | async)!" [renderer]="($scrollbarThumbRenderer | async)!"
            [thickness]="($scrollbarThickness | async)!" [params]="($scrollbarThumbParams | async)!"
            [loading]="($loading | async)!" [overlapping]="($overlappingScrollbar | async)!"
            [thumbGradientPositions]="($thumbGradientPositionsVertical | async)!"
            [prepared]="($preparedSignal | async)!" [interactive]="($scrollbarInteractive | async)!"
            [show]="($scrollbarVerticalShow | async)!" [topOffset]="($topOffset | async)!"
            [langTextDir]="($langTextDir | async)!" [bottomOffset]="($bottomOffset | async)!"
            [overscrollEnabled]="($overscrollEnabled | async)!" [scrollBehavior]="($scrollBehavior | async)!"
            [scrollbarMinSize]="($scrollbarMinSize | async)!" (onDrag)="onScrollBarDragHandler($event)"
            (onDragEnd)="onScrollBarDragEndHandler($event)"></ng-scroll-bar>

        <ng-scroll-bar *ngIf="($scrollbarHorizontalEnabled | async)!" #scrollBarHorizontal direction="horizontal"
            [size]="($thumbSizeHorizontal | async)!" [renderer]="($scrollbarThumbRenderer | async)!"
            [thickness]="($scrollbarThickness | async)!" [params]="($scrollbarThumbParams | async)!"
            [loading]="($loading | async)!" [overlapping]="($overlappingScrollbar | async)!"
            [thumbGradientPositions]="($thumbGradientPositionsHorizontal | async)!"
            [prepared]="($preparedSignal | async)!" [interactive]="($scrollbarInteractive | async)!"
            [show]="($scrollbarHorizontalShow | async)!" [leftOffset]="($leftOffset | async)!"
            [langTextDir]="($langTextDir | async)!" [rightOffset]="($rightOffset | async)!"
            [overscrollEnabled]="($overscrollEnabled | async)!" [scrollBehavior]="($scrollBehavior | async)!"
            [scrollbarMinSize]="($scrollbarMinSize | async)!" (onDrag)="onScrollBarDragHandler($event)"
            (onDragEnd)="onScrollBarDragEndHandler($event)"></ng-scroll-bar>
    </ng-container>
</div>
